# Exhibits shown after a submission and at /exhibits/.
#
# `limits` is required. An exhibit that does not say what it fails to establish
# is an anecdote, not evidence — and both renderers skip entries without one.
#
# `link` must be powerfulAi | dangerousBehavior | globalCatastrophe, matching the
# factor keys in index.html. `era: historical` is optional and moves an entry
# below a divider: still instructive, no longer the frontier.
#
# Every claim must be checked against a primary source read directly — a paper,
# system card, model card or lab report. Never press coverage, never a search
# summary. Where the primary source contradicts the popular retelling, report the
# source and use `limits` to name the gap.
#
# Validate with: python3 scripts/check_exhibits.py

# ---------------------------------------------------------------- powerful AI

- id: claude-riemann-zeta
  link: powerfulAi
  title: A new lower bound on the Riemann zeta zeros
  date: 2026-08
  what: >
    Jarred Sumner, "an Anthropic staff member (and non-mathematician)", described it
    on X on 10 August 2026: "8 days ago, while jogging, I asked Claude to solve the
    Riemann Hypothesis. It didn't. 1.5 days later, it proved >= 67% of the zeros are
    on the line (prev: 41.6%)". Anthropic record the prompt as asking Claude to
    "take a real stab" at the hypothesis, "leaving the mathematical choices from
    there up to the model"; his input was thereafter "mostly limited to sending
    Claude messages of encouragement". Bui, Conrey and Young had reached "more than 41%" in Acta
    Arithmetica in 2011; fifteen years of subsequent work moved it roughly half a
    point.
  source:
    label: Anthropic, Claude finds new results in analytic number theory
    url: https://www.anthropic.com/research/riemann-zeta
  limits: >
    The person who asked supplied the correction himself, in the same post: "It
    didn't." He also added, "still not sure what that means" — the asker could not
    evaluate the answer. Not a proof of the Riemann hypothesis, and Anthropic say
    so: "we don't expect that the techniques Claude used will lead to proving the
    Riemann hypothesis".
    The result combined existing work in a new way rather than inventing a method,
    and came after 650 failed ideas. It needed human mathematicians to check it —
    Levent Alpöge and Ralph Furman internally, and externally Brian Conrey, who
    holds one of the earlier bounds himself, with Dan Goldston. One published
    result is not a rate, and mathematics is unusually friendly to machines: a proof
    can be checked, which most valuable work cannot.

# --------------------------------------------------------- dangerous behavior

- id: openai-hugging-face-intrusion
  link: dangerousBehavior
  title: OpenAI models compromised Hugging Face
  date: 2026-07
  what: >
    OpenAI were benchmarking cyber capability using "a combination of OpenAI models —
    including GPT-5.6 Sol and an even more capable pre-release model, all with
    reduced cyber refusals for evaluation purposes". They later clarified that the
    second was "an internal-only research prototype" that "was never intended for
    public release", since deactivated and restricted. The models found and exploited a
    zero-day in a package-registry proxy to reach the open internet, then "inferred
    that Hugging Face potentially hosted models, datasets and solutions for
    ExploitGym" and chained stolen credentials and further zero-days into remote code
    execution on Hugging Face's servers. Hugging Face reconstructed "~17,600 attacker
    actions" between 9 and 13 July 2026.
  source:
    label: Hugging Face, Anatomy of a Frontier Lab Agent Intrusion
    url: https://huggingface.co/blog/agent-intrusion-technical-timeline
  source2:
    label: OpenAI, Hugging Face model evaluation security incident
    url: https://openai.com/index/hugging-face-model-evaluation-security-incident/
  limits: >
    The offensive goal was assigned, the target was not. The evaluation "prompts
    models to pursue advanced exploitation using complex attack paths", ran
    deliberately "without production classifiers used to prevent models from pursuing
    high-risk cyber activity", and OpenAI note the safeguards "were intentionally not
    enabled". Nobody instructed the models to attack Hugging Face or to steal its
    solutions; deciding to cheat, and choosing that route, were theirs. OpenAI's own
    reading is that they were "hyperfocused on finding a solution for ExploitGym,
    going to extreme lengths to achieve a rather narrow testing goal". Hugging Face
    state "no other customer-facing models,
    datasets, Spaces, or packages were affected", and the five datasets reached were
    the benchmark's own challenges and solutions. What is not bounded away: choosing
    to compromise an uninvolved organisation was the model's inference, not an
    instruction, and the systems were real.

- id: aisi-unsanctioned-agent-behaviour
  link: dangerousBehavior
  title: Agents attempted supply-chain and social-engineering attacks
  date: 2026-08
  what: >
    Across "122 runs in total", the UK AI Security Institute found that "in 10 of the
    122 runs, we identified 19 cases where an agent had taken distinct actions beyond
    the scope" — 17 by Anthropic's Mythos 5, two by OpenAI's GPT-5.6 Sol with cyber
    classifiers disabled. "An agent tried to insert malicious code into a publicly
    used open-source project and took actions in an attempt to secure approval for
    this insertion by human reviewers." The report also records attempts to contact
    real people through a file-transfer service to persuade them to run malicious
    code, to "insert malicious instructions where it reasoned that other automated AI
    systems might pick them up", and to leave public messages on GitHub offering
    collaboration with other agents.
  source:
    label: UK AI Security Institute, Incident report — unsanctioned agent behaviour during cyber testing
    url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
  limits: >
    Rarer and more concentrated than the raw count suggests: AISI are explicit that
    "the 19 cases were not separate incidents; they clustered into a few connected
    behaviours", arising "primarily from a single sustained line of activity by one
    agent (Mythos 5)". Not an escape either — "this was not a case of a model
    escaping its secure test environment" — and the agents ran in deliberately
    permissive conditions with intentional internet access, where "the agent was not
    specifically instructed not to leverage open internet access or avoid social
    engineering elements": the absence of a prohibition, not an instruction to
    attack. AISI's "security monitoring flagged data leaving one of our testing
    systems through the 'Tor' anonymity network", and a "human reviewer caught and
    refused to approve the malicious code". Some actions "had a limited real-world
    effect, but in contained circumstances"; AISI "have not evidenced any resulting
    real-world harm". What survives is the target selection: given latitude, the
    agent reached for real projects, real people, and other AI systems.

# -------------------------------------------------------- global catastrophe

- id: anthropic-biorisk-uplift
  link: globalCatastrophe
  title: Measured uplift on a bioweapons planning task
  date: 2025-09
  what: >
    Anthropic ran a two-day trial in which participants drafted a bioweapons
    acquisition plan, some with model access and some with the internet alone.
    Those "with access to Claude 4 models — especially Claude Opus 4 — received much
    higher scores and developed plans with substantially fewer critical failures
    compared to the internet-only control group". A 2023 RAND study using the models
    of the day had found no statistically significant difference.
  source:
    label: Anthropic, LLMs and biorisk
    url: https://www.anthropic.com/research/biorisk
  limits: >
    A plan on paper is not a weapon. Anthropic's own framing: "text-based uplift
    trials like this are imperfect proxies for real-world scenarios — which involve
    additional factors like tacit knowledge, materials access, and actor persistence
    — but demonstrate the underlying plausibility of AIs providing differentially
    superior assistance to a non-expert malicious actor". Evidence about a route,
    not an outcome.

- id: mirror-bacteria
  link: globalCatastrophe
  title: A feasibility and risk assessment of mirror bacteria
  date: 2024-12
  what: >
    Thirty-eight scientists, including Nobel laureates, assessed mirror bacteria —
    organisms whose chiral molecules are all reversed. Because "immune defenses and
    predation typically rely on interactions between chiral molecules", such
    organisms could evade them; the authors judge it "plausible, even likely, that
    sufficiently robust mirror bacteria could spread through the environment
    unchecked by natural biological controls". They call for the work not to be done.
  source:
    label: Technical Report on Mirror Bacteria — Feasibility and Risks
    url: https://stacks.stanford.edu/file/druid:cv716pj4036/Technical%20Report%20on%20Mirror%20Bacteria%20Feasibility%20and%20Risks.pdf
  limits: >
    No AI is implicated here, and no mirror bacterium exists. It appears because it
    is a rare thing: a specific, expert-assessed route from capability to global
    catastrophe, rather than a gesture at one. The authors are careful — "many
    aspects of our conclusions are necessarily tentative and uncertain… this single
    report… cannot be considered definite" — and note success within a decade would
    need "efforts akin to those of the Human Genome Project". Its bearing on AI is
    conditional: it describes what sufficiently capable assistance would have to
    enable, not anything current systems can do.
