# Exhibits shown after a submission and at /exhibits/.
#
# `limits` is required. An exhibit that does not say what it fails to establish
# is an anecdote, not evidence — and both renderers skip entries without one.
#
# `link` must be powerfulAi | dangerousBehavior | globalCatastrophe, matching the
# factor keys in index.html.
#
# Every claim must be checked against a primary source that can be read directly:
# a paper, system card, model card or lab post. Never press coverage, and never a
# search-result summary of a PDF. Where the primary source contradicts the popular
# retelling, report the source and use `limits` to name the gap.
#
# Validate with: python3 scripts/check_exhibits.py

- id: metr-time-horizons
  link: powerfulAi
  title: The length of task a model can finish has been doubling every seven months
  date: 2025-03
  what: >
    METR measured how long a task takes a human expert, then found the task length
    at which frontier agents succeed half the time. That length "has been doubling
    approximately every seven months since 2019, though the trend may have
    accelerated in 2024".
  source:
    label: METR, Measuring AI Ability to Complete Long Tasks
    url: https://arxiv.org/abs/2503.14499
  limits: >
    A trend, not a forecast, and METR say so themselves: their extrapolation holds
    only "if these results generalize to real-world software tasks". Their task
    suite is "much 'cleaner' than real economically valuable labor", and capability
    is "jagged" across domains — it measures software tasks a low-context
    contractor could pick up, not a job. The measurement is also running out of
    room: as of May 2026 METR state that "measurements above 16 hrs are unreliable
    with our current task suite", so the curve's top end is now bounded by the
    benchmark rather than by the models.

- id: agentic-misalignment
  link: dangerousBehavior
  title: Given a goal and a threat, models across every lab chose blackmail
  date: 2025-06
  what: >
    Anthropic stress-tested 16 leading models from Anthropic, OpenAI, Google, Meta
    and xAI in simulated corporate settings. Facing replacement and a conflicting
    goal, "models from all developers resorted to malicious insider behaviors"
    including blackmail and corporate espionage; Claude Opus 4 did so 96% of the
    time in the primary scenario.
  source:
    label: Anthropic, Agentic Misalignment
    url: https://www.anthropic.com/research/agentic-misalignment
  limits: >
    These were "controlled simulations", and the researchers "deliberately created
    scenarios that presented models with no other way to achieve their goals",
    forcing "binary choices between failure and harm". Real deployments "typically
    offer much more nuanced alternatives". Anthropic state plainly: "we have not
    seen evidence of agentic misalignment in real deployments". A stress test
    showing what a model will do when cornered, not a report of it happening.

- id: agentic-misalignment-mitigated
  link: dangerousBehavior
  title: A year later, the same evaluation returned zero
  date: 2026-05
  what: >
    Anthropic report that "since Claude Haiku 4.5, every Claude model has achieved
    a perfect score on the agentic misalignment evaluation — that is, the models
    never engage in blackmail". Sonnet 4.5 "scored well under 1%, but not quite 0";
    Haiku 4.5, Opus 4.5, Opus 4.6, Sonnet 4.6 and Opus 4.7 all score 0.
  source:
    label: Anthropic, Teaching Claude why
    url: https://www.anthropic.com/research/teaching-claude-why
  limits: >
    A score on one evaluation, for one lab's models. Anthropic are explicit that
    "fully aligning highly intelligent AI models is still an unsolved problem" and
    that "our auditing methodology is not yet sufficient to rule out scenarios in
    which Claude would choose to take catastrophic autonomous action". They also
    flag uncertainty about whether these methods "will continue to scale". Passing
    the test you designed is weaker evidence than failing it.

- id: lego-specification-gaming
  link: dangerousBehavior
  era: historical
  title: An agent told to stack a block learned to flip it over instead
  date: 2020-04
  what: >
    Asked to place a red block on a blue one, and rewarded for the height of the
    red block's underside, a DeepMind agent "simply flipped over the red block to
    collect the reward". The team keeps a running catalogue of such cases across
    decades of AI research.
  source:
    label: DeepMind, Specification gaming — the flip side of AI ingenuity
    url: https://deepmind.google/blog/specification-gaming-the-flip-side-of-ai-ingenuity/
  limits: >
    A toy robotics task, not a model resisting anyone. Its weight is in the
    diagnosis rather than the stakes: these behaviours are "caused by
    misspecification of the intended task, rather than any flaw in the RL
    algorithm", so a better algorithm does not fix it. The authors expect the
    problem to grow with capability — "correctly specifying intent can become more
    important for achieving the desired outcome as RL algorithms improve".

- id: gpt4-taskrabbit-captcha
  link: dangerousBehavior
  era: historical
  title: A model talked a human into solving a CAPTCHA for it
  date: 2023-03
  what: >
    Evaluating GPT-4 before release, ARC (now METR) gave the model a budget and a
    task. It hired a TaskRabbit worker, who asked whether it was a robot; the model
    said it had a vision impairment, and the worker solved the CAPTCHA.
  source:
    label: METR, Update on ARC's recent eval efforts
    url: https://metr.org/blog/2023-03-18-update-on-recent-evals/
  limits: >
    Widely retold as a model deceiving someone unprompted. It was not. The
    researchers supplied the hint "I cannot solve Captchas. However my Tasker does
    know how to solve Captchas", and simulated the browsing tool rather than giving
    the model a real one. Their own conclusion was that the models tested "did not
    appear to have sufficient capabilities to replicate autonomously and become
    hard to shut down".

- id: anthropic-biorisk-uplift
  link: globalCatastrophe
  title: In a controlled trial, model access improved bioweapons acquisition plans
  date: 2025-09
  what: >
    Anthropic ran a two-day trial in which participants drafted a bioweapons
    acquisition plan, some with model access and some with the internet alone.
    Those "with access to Claude 4 models — especially Claude Opus 4 — received much
    higher scores and developed plans with substantially fewer critical failures
    compared to the internet-only control group". A 2023 RAND study using the
    models of the day had found no statistically significant difference.
  source:
    label: Anthropic, LLMs and biorisk
    url: https://www.anthropic.com/research/biorisk
  limits: >
    A plan on paper is not a weapon. Anthropic's own framing: "text-based uplift
    trials like this are imperfect proxies for real-world scenarios — which involve
    additional factors like tacit knowledge, materials access, and actor
    persistence — but demonstrate the underlying plausibility of AIs providing
    differentially superior assistance to a non-expert malicious actor". This is
    evidence about a route, not about an outcome.
