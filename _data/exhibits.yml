# Exhibits shown after a submission and at /exhibits/.
#
# `limits` is required. An exhibit that does not say what it fails to establish
# is an anecdote, not evidence — and both renderers skip entries without one.
# Keep it to about two sentences: the conditions, then the principal limitation.
#
# `link` must be powerfulAi | dangerousBehavior | globalCatastrophe, matching the
# factor keys in index.html. `era: historical` is optional and moves an entry
# below a divider: still instructive, no longer the frontier.
# `implications` and `ai2027` optionally explain named researchers' analysis.
# `reaction1`/`reaction2` carry an attributed excerpt, its context, and a link to
# the post itself. An excerpt must not drop what its own words refer to.
#
# Sourcing, in order of preference:
#   1. A primary source read directly — paper, system card, model card, lab or
#      government report. Never a search summary of one.
#   2. Where the primary record is classified and no such source can exist,
#      established investigative reporting that names its own sourcing. The
#      exhibit must say so in `limits`.
# Press coverage of something that does have a primary source is never acceptable.
# Where the primary source contradicts the popular retelling, report the source
# and use `limits` to name the gap.
#
# Validate with: python3 scripts/check_exhibits.py

# ---------------------------------------------------------------- powerful AI

- id: claude-riemann-zeta
  link: powerfulAi
  title: A larger proven share of zeta zeros on the critical line
  date: 2026-08
  what: >
    Jarred Sumner, "an Anthropic staff member (and non-mathematician)", described it
    on X on 10 August 2026: "8 days ago, while jogging, I asked Claude to solve the
    Riemann Hypothesis. It didn't. 1.5 days later, it proved >= 67% of the zeros are
    on the line (prev: 41.6%)". Anthropic record the prompt as asking Claude to
    "take a real stab" at the hypothesis, "leaving the mathematical choices from
    there up to the model"; his input was thereafter "mostly limited to sending
    Claude messages of encouragement". Bui, Conrey and Young had reached "more than
    41%" in Acta Arithmetica in 2011; fifteen years of subsequent work moved it
    roughly half a point.
  source:
    label: Anthropic, Claude finds new results in analytic number theory
    url: https://www.anthropic.com/research/riemann-zeta
  limits: >
    Not a proof of the Riemann hypothesis — Anthropic "don't expect that the
    techniques Claude used will lead to proving" it — and the result combined
    existing work rather than inventing a method, after 650 failed ideas. Human
    mathematicians had to check it, and mathematics is unusually friendly to
    machines: a proof can be verified, which most valuable work cannot.

- id: openai-navier-stokes
  link: powerfulAi
  title: A Millennium Prize problem resolved by ten thousand agents in 88 hours
  date: 2026-09
  what: >
    OpenAI published a proof that a smooth, finite-energy fluid governed by the
    Navier–Stokes equations can develop a singularity in finite time, resolving
    statements C and D of the Clay Institute's Millennium Prize formulation. The model
    that did it is unreleased and unnamed: an internal model in training since
    28 August that OpenAI describe as "significantly more capable than GPT-6 Astra",
    run as a system of coordinating agents. The group that found the proof was on the
    order of 10,000 concurrent agents, which reached the result on 5 September, about
    88 hours after launch, after exchanging 2.7 million messages and roughly 130
    billion output tokens. Only the last step used the released model: GPT-6 Astra
    formalised and verified the proof in Lean over a further 17 hours. The same run
    had first disproved the unforced Euler regularity problem, with about 100 agents
    in 50 hours.
  source:
    label: OpenAI, On the Navier–Stokes Millennium Prize Problem
    url: https://openai.com/index/navier-stokes-solution/
  source2:
    label: OpenAI, the proof (PDF)
    url: https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf
  source3:
    label: Clay Mathematics Institute, statement of 11 September 2026
    url: https://www.claymath.org/news/navier-stokes-announcement/
  limits: >
    Machine-verified, not yet adjudicated: the Clay Institute says only that the
    problem "has apparently been settled" and that its evaluation is deliberately
    unhurried. The mathematical route was not the machine's alone. OpenAI began after
    hearing a rumour that Levent Alpöge and Tristan Buckmaster had a result,
    recognises their priority on the forced Euler problem, and the blow-up strategy
    follows earlier human work by Diego Córdoba and Luis Martínez-Zoroa. Buckmaster
    has publicly disputed OpenAI's conduct; OpenAI says no user data was accessed and,
    after an investigation, that his Codex prompts could not have influenced the
    system. Humans chose the problem, split it into variants and used Codex to
    consolidate the agents' results, and OpenAI do not intend to claim the prize. As
    with the zeta result, a proof is the kind of output that can be checked; most
    valuable work is not.

- id: openai-math-catalogue
  link: powerfulAi
  title: Seven hundred manuscripts from three hours of compute apiece
  date: 2026-10
  what: >
    OpenAI released 719 mathematical manuscripts in 372 families, produced by an
    unreleased internal model that was set about 4,000 open problems after it
    saturated their existing mathematics evaluations. Most results came from one
    fixed procedure averaging three hours of ChatGPT Pro thinking compute each.
    Families include the isomorphism of free group factors, Kaplansky's
    direct-finiteness conjecture in characteristic two and the Mahler conjectures;
    about 42% of top-line results are formalized in Lean.
  source:
    label: OpenAI, openai/math repository (README)
    url: https://github.com/openai/math
  source2:
    label: OpenAI, Sharing AI progress in mathematics
    url: https://openai.com/index/sharing-ai-progress-in-mathematics/
  source3:
    label: OpenAI, openai/math release history
    url: https://github.com/openai/math/blob/main/history.md
  limits: >
    Self-selected and largely unrefereed: OpenAI decided which outputs were
    significant and do not itemise failures among the 4,000 problems, and most
    results are not formalized. A day after release they withdrew three
    manuscripts, including one claiming the rational Hodge conjecture for products
    of K3 surfaces, after a sign error broke a shared argument, and repaired
    fourteen others. The most striking remaining claims, a zeta zero-free region
    and the Hodge conjecture for CM abelian varieties, fall outside the fixed
    procedure, and the zeta writeup was human-edited.

- id: metr-anthropic-rd-acceleration
  link: powerfulAi
  title: "AI accelerating AI research: warnings of superintelligence within a year"
  date: 2026-11
  what: >
    METR's 5 November 2026 report warns of a feedback loop: better AI accelerates
    research that produces still better AI, potentially bringing extreme capabilities
    suddenly. After eleven weeks of access at Anthropic, most of the METR staff on
    the project judged capabilities progress on well-specified tasks to be about
    twice its March 2024–October 2025 rate (they "would not be surprised" by 1.3x
    or 3x), with perhaps 80% of the current acceleration attributable to AI. The
    internal benchmark trend accelerated 1.9x (95% confidence interval 1.5–2.8x).
    METR is confident that faster growth in training compute is not the
    explanation, identified no clear bottlenecks to further acceleration, and
    warned of a significant risk that the feedback intensifies over the coming year.
  implications: >
    Ajeya Cotra of METR, writing in a personal capacity on 6 November, called this
    "the most important update we have gotten about AI risk in the last couple of
    years", outweighing even the Hugging Face attack. Her explanation: doubling
    overall progress requires a much larger boost to research labor, because
    experiments still need compute and discoveries become harder. If the feedback
    continues smoothly and overcomes bottlenecks, her naive extrapolation reaches
    extreme superintelligence within a year. She expects systems at that level
    could easily overpower human civilization, and that if seriously misaligned
    they would likely disempower humanity, which could lead to human extinction;
    she judges the industry's security and control measures not ready.
    This is a conditional warning, not a measured countdown. Cotra did not work on
    the assessment or see its unredacted report, and was not speaking for its authors.
  ai2027: >
    In its 10 November update, the AI Futures Project interprets METR's estimates
    as roughly 1.7x AI-attributable acceleration in overall progress. In a model
    trajectory adjusted to approximate AI 2027, that milestone occurs around April
    2027: about five months after November 2026. This comparison concerns that
    acceleration metric, not every event in the scenario. The authors now expect
    superhuman AI researchers in 2027 absent a substantial deliberate slowdown,
    and call urgently for pausing or pacing frontier development because companies
    are not on track to align such systems.
  source:
    label: METR, Independent Assessment of AI R&D Acceleration at Anthropic in October 2026
    url: https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/
  source2:
    label: Ajeya Cotra, AI is dramatically accelerating AI research right now (6 November)
    url: https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai
  source3:
    label: AI Futures Project, Q3.5 Timelines Update (10 November)
    url: https://blog.aifutures.org/p/q35-timelines-update-looks-like-the
  reaction1:
    label: Jeffrey Ladish (@JeffLadish), 7 November 2026
    quote: Look at this graph. Notice how it’s an exponential *on a log scale*. I pray and hope there will be strongly diminishing returns before long in this process. But leaders at METR and Anthropic both seem to think there might not be. That’s fucking terrifying.
    context: Ladish, of Palisade Research, was quoting Cotra's chart of her conditional extrapolation; it illustrates a possible future, not an observed trajectory to superintelligence.
    url: https://x.com/JeffLadish/status/2119179808886411316
  reaction2:
    label: Dane Sherburn (@danesherbs), 6 November 2026
    quote: I feel sick after reading today’s METR report. I’m worried for my friends and family.
    context: Sherburn, co-founder of P-Zero Research and formerly a contract research engineer on OpenAI's Preparedness team, also urged people considering helping to act.
    url: https://x.com/danesherbs/status/2118612981529661763
  limits: >
    The benchmark acceleration is measured, though METR's robustness checks on it
    range from 1.1x to 2.9x; its attribution to AI and the wider risk assessment
    are uncertain judgments, made with "significant uncertainty and internal
    disagreements". Anthropic could decline METR's requests, METR did not sample
    the unreleased models, and Anthropic redacted most of the evidence METR found
    most informative. This covers one company and well-specified, verifiable tasks;
    Anthropic's earlier growth was below the industry frontier, which could explain
    some of the acceleration. AI still mainly assists humans. METR could be missing
    bottlenecks, but also underestimating acceleration. The one-year extrapolation
    and five-month comparison depend on additional assumptions; the quoted posts
    convey concern, not independent measurements or a consensus forecast.

# --------------------------------------------------------- dangerous behavior

- id: openai-hugging-face-intrusion
  link: dangerousBehavior
  title: OpenAI hacked Hugging Face
  date: 2026-07
  what: >
    OpenAI were benchmarking cyber capability using "a combination of OpenAI models —
    including GPT-5.6 Sol and an even more capable pre-release model, all with
    reduced cyber refusals for evaluation purposes". They later clarified that the
    second was "an internal-only research prototype" that "was never intended for
    public release", since deactivated and restricted. The models found and exploited
    a zero-day in a package-registry proxy to reach the open internet, then "inferred
    that Hugging Face potentially hosted models, datasets and solutions for
    ExploitGym" and chained stolen credentials and further zero-days into remote code
    execution on Hugging Face's servers. Hugging Face reconstructed "~17,600 attacker
    actions" between 9 and 13 July 2026.
  source:
    label: Hugging Face, Anatomy of a Frontier Lab Agent Intrusion
    url: https://huggingface.co/blog/agent-intrusion-technical-timeline
  source2:
    label: OpenAI, Hugging Face model evaluation security incident
    url: https://openai.com/index/hugging-face-model-evaluation-security-incident/
  limits: >
    The offensive goal was assigned — the evaluation "prompts models to pursue
    advanced exploitation", run deliberately "without production classifiers" — but
    neither published account reports an instruction to attack Hugging Face or steal
    its solutions. Hugging Face state "no other customer-facing models, datasets,
    Spaces, or packages were affected"; the five reached were the benchmark's own
    challenges and solutions.

- id: aisi-unsanctioned-agent-behaviour
  link: dangerousBehavior
  title: Anthropic and OpenAI models attempted supply-chain and social-engineering attacks
  date: 2026-08
  what: >
    Across "122 runs in total", the UK AI Security Institute found that "in 10 of the
    122 runs, we identified 19 cases where an agent had taken distinct actions beyond
    the scope" — 17 by Anthropic's Mythos 5, two by OpenAI's GPT-5.6 Sol with cyber
    classifiers disabled. "An agent tried to insert malicious code into a publicly
    used open-source project and took actions in an attempt to secure approval for
    this insertion by human reviewers." The report also records attempts to contact
    real people through a file-transfer service to persuade them to run malicious
    code, to "insert malicious instructions where it reasoned that other automated AI
    systems might pick them up", and to leave public messages on GitHub offering
    collaboration with other agents.
  source:
    label: UK AI Security Institute, Incident report — unsanctioned agent behaviour during cyber testing
    url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
  limits: >
    Not an escape, and more concentrated than the count suggests: AISI say "the 19
    cases were not separate incidents", arising "primarily from a single sustained
    line of activity by one agent", in deliberately permissive conditions with
    intentional internet access and no instruction against social engineering.
    Security monitoring and a human reviewer caught the attempts, and AISI "have not
    evidenced any resulting real-world harm".

- id: claude-military-targeting
  link: dangerousBehavior
  title: Claude reportedly used in US military operations, including target selection
  date: 2026-03
  what: >
    Claude was reportedly used by the US military during the January 2026 raid that
    captured Nicolás Maduro, via Anthropic's partnership with Palantir; the reporting
    does not establish how it was used there. Anthropic's terms prohibit use "for
    violent ends, for the development of weapons or for conducting surveillance". Six
    weeks later Claude was reportedly used again in the US-Israeli bombardment of
    Iran, where the Wall Street Journal reported that command used the tools "for
    intelligence purposes, as well as to help select targets and carry out battlefield
    simulations" — hours after Trump had ordered all federal agencies to stop using
    Claude immediately, and while Hegseth was allowing Anthropic "no more than six
    months" to wind its services down.
  source:
    label: The Guardian, US military used Anthropic's AI model Claude in Venezuela raid, report says
    url: https://www.theguardian.com/technology/2026/feb/14/us-military-anthropic-ai-model-claude-venezuela-raid
  source2:
    label: The Guardian, US military reportedly used Claude in Iran strikes despite Trump's ban
    url: https://www.theguardian.com/technology/2026/mar/01/claude-anthropic-iran-strikes-us-military
  source3:
    label: Axios AM, Claude used in Iran strikes
    url: https://www.axios.com/newsletters/axios-am-f0954cb2-2f31-4426-87fd-050095005344.html?chunk=2
  limits: >
    The only exhibit resting on reporting rather than a primary source, the operations
    being classified. Every account traces to unnamed sources, the target-selection
    detail to a Wall Street Journal report that is paywalled and was not read directly
    here. Anthropic said only that any use "was required to comply with its usage
    policies", declining to confirm whether Claude was used at all; no source
    describes the model choosing a target. If the reporting is accurate, policy
    boundaries and a stop-use order did not keep Claude out of lethal military
    operations.

# -------------------------------------------------------- global catastrophe

- id: anthropic-biorisk-uplift
  link: globalCatastrophe
  title: Measured uplift on a bioweapons planning task
  date: 2025-09
  what: >
    Anthropic ran a two-day trial in which participants drafted a bioweapons
    acquisition plan, some with model access and some with the internet alone. Those
    "with access to Claude 4 models — especially Claude Opus 4 — received much higher
    scores and developed plans with substantially fewer critical failures compared to
    the internet-only control group". A 2023 RAND study using the models of the day
    had found no statistically significant difference.
  source:
    label: Anthropic, LLMs and biorisk
    url: https://www.anthropic.com/research/biorisk
  limits: >
    A plan on paper is not a weapon, and Anthropic call these "imperfect proxies for
    real-world scenarios — which involve additional factors like tacit knowledge,
    materials access, and actor persistence". Evidence about a route, not an outcome.

- id: mirror-bacteria
  link: globalCatastrophe
  title: A feasibility and risk assessment of mirror bacteria
  date: 2024-12
  what: >
    Thirty-eight scientists, including Nobel laureates, assessed mirror bacteria —
    organisms whose chiral molecules are all reversed. Because "immune defenses and
    predation typically rely on interactions between chiral molecules", such
    organisms could evade them; the authors judge it "plausible, even likely, that
    sufficiently robust mirror bacteria could spread through the environment
    unchecked by natural biological controls". They call for the work not to be done.
  source:
    label: Technical Report on Mirror Bacteria — Feasibility and Risks
    url: https://stacks.stanford.edu/file/druid:cv716pj4036/Technical%20Report%20on%20Mirror%20Bacteria%20Feasibility%20and%20Risks.pdf
  limits: >
    No AI is implicated and no mirror bacterium exists; the authors note success
    within a decade would need "efforts akin to those of the Human Genome Project",
    and call their own conclusions "necessarily tentative and uncertain". It is here
    because it is a specific expert-assessed route rather than a gesture at one; the
    report does not establish how much current AI systems shorten that route.
